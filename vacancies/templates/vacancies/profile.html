<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Профиль — Job AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
            margin: 0;
            padding: 40px;
        }

        header {
            background: #222;
            color: white;
            padding: 18px 40px;
            margin: -40px -40px 40px -40px;
        }

        .header-inner {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            opacity: 0.85;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #222;
        }

        .button {
            padding: 12px 20px;
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .button:hover {
            background: #444;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #666;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            Job AI
        </div>

        <div class="nav">
            <a href="/vacancies/">
                Вакансии
            </a>
        </div>

    </div>
</header>

<div class="container">

    <a class="back" href="/vacancies/">
        ← К вакансиям
    </a>

    <div class="card">

        <h1>Мой профиль</h1>

        <p style="color: #666; margin-bottom: 30px;">
            Укажите свои навыки и желаемую зарплату.
            Job AI использует их для подбора вакансий.
        </p>

        <form method="post">

            {% csrf_token %}

            <div class="field">
                <label for="name">
                    Имя
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ profile.name|default:'' }}"
                    placeholder="Например, Ярослав"
                >
            </div>

            <div class="field">
                <label for="skills">
                    Навыки
                </label>

                <textarea
                    id="skills"
                    name="skills"
                    placeholder="Python, Django, PostgreSQL, Docker"
                >{{ profile.skills|default:'' }}</textarea>
            </div>

            <div class="field">
                <label for="min_salary">
                    Минимальная зарплата
                </label>

                <input
                    type="number"
                    id="min_salary"
                    name="min_salary"
                    value="{{ profile.min_salary|default:'' }}"
                    placeholder="150000"
                >
            </div>

            <button class="button" type="submit">
                Сохранить профиль
            </button>

        </form>

    </div>

</div>

</body>

</html>
