
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f8">
    <title>{% block title %}Job AI{% endblock %}</title>

    <style>
        :root {
            --bg: #f5f6f8;
            --surface: #ffffff;
            --text: #17191f;
            --muted: #747985;
            --border: #e7e9ee;
            --accent: #20242c;
            --accent-hover: #363c47;
            --success: #16845b;
            --success-bg: #eaf7f0;
            --error: #b42318;
            --error-bg: #fff0ef;
            --radius: 22px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(
                    circle at 50% 0%,
                    #e9edf5 0,
                    transparent 42%
                ),
                var(--bg);
            color: var(--text);
            font-family:
                Inter, -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
        }

        .topbar {
            width: 100%;
            border-bottom: 1px solid rgba(231, 233, 238, 0.8);
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(14px);
        }

        .topbar-inner {
            width: min(1120px, calc(100% - 40px));
            min-height: 76px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            text-decoration: none;
        }

        .brand-mark {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: var(--accent);
            color: #fff;
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand-name {
            font-size: 19px;
            font-weight: 750;
            letter-spacing: -0.7px;
        }

        .brand-caption {
            margin-top: 3px;
            color: var(--muted);
            font-size: 11px;
        }

        .top-link {
            color: #555b66;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
        }

        .top-link:hover {
            color: var(--text);
        }

        .main {
            width: 100%;
            flex: 1;
            display: grid;
            place-items: center;
            padding: 52px 20px 64px;
        }

        .auth-card {
            width: 100%;
            max-width: 470px;
            padding: 42px;
            border: 1px solid rgba(231, 233, 238, 0.9);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow:
                0 24px 70px rgba(22, 28, 45, 0.07),
                0 2px 8px rgba(22, 28, 45, 0.025);
        }

        .icon-wrap {
            width: 58px;
            height: 58px;
            margin-bottom: 26px;
            display: grid;
            place-items: center;
            border-radius: 18px;
            background: #f0f2f6;
            color: var(--accent);
        }

        .icon-wrap.success {
            background: var(--success-bg);
            color: var(--success);
        }

        .icon-wrap.error {
            background: var(--error-bg);
            color: var(--error);
        }

        .icon-wrap svg {
            width: 27px;
            height: 27px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .eyebrow {
            margin: 0 0 11px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 750;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(26px, 5vw, 32px);
            line-height: 1.2;
            letter-spacing: -1.2px;
            font-weight: 780;
        }

        .description {
            margin: 15px 0 0;
            color: #676d79;
            font-size: 14px;
            line-height: 1.8;
        }

        .notice {
            margin-top: 25px;
            padding: 15px 16px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: #fafbfc;
            color: #555b66;
            font-size: 13px;
            line-height: 1.7;
        }

        .notice strong {
            color: var(--text);
        }

        .form {
            margin-top: 28px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            font-weight: 650;
        }

        .field input {
            width: 100%;
            min-height: 50px;
            padding: 13px 15px;
            border: 1px solid #dfe2e8;
            border-radius: 12px;
            outline: none;
            background: #fff;
            color: var(--text);
            font: inherit;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .field input::placeholder {
            color: #a0a5af;
        }

        .field input:focus {
            border-color: #777f8d;
            box-shadow: 0 0 0 4px rgba(32, 36, 44, 0.06);
        }

        .button {
            width: 100%;
            min-height: 51px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 13px 18px;
            border: 0;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .button svg {
            width: 17px;
            height: 17px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .secondary-link {
            display: block;
            margin-top: 21px;
            color: #626977;
            font-size: 13px;
            line-height: 1.7;
            text-align: center;
            text-decoration: none;
        }

        .secondary-link:hover {
            color: var(--text);
        }

        .errorlist {
            margin: 8px 0 0;
            padding-left: 18px;
            color: var(--error);
            font-size: 12px;
            line-height: 1.6;
        }

        .footer {
            padding: 20px;
            color: #9095a0;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 520px) {
            .topbar-inner {
                width: calc(100% - 32px);
                min-height: 68px;
            }

            .brand-mark {
                width: 36px;
                height: 36px;
                border-radius: 11px;
            }

            .brand-name {
                font-size: 17px;
            }

            .main {
                padding: 30px 16px 40px;
                align-items: start;
            }

            .auth-card {
                padding: 28px 23px;
                border-radius: 18px;
            }

            .icon-wrap {
                margin-bottom: 22px;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a class="brand" href="/vacancies/">
                <span class="brand-mark">J</span>
                <span>
                    <span class="brand-name">Job AI</span>
                    <span class="brand-caption" style="display:block;">
                        Умный поиск вакансий
                    </span>
                </span>
            </a>

            <a class="top-link" href="/login/">Войти в аккаунт →</a>
        </div>
    </header>

    <main class="main">
        <section class="auth-card">
            {% block content %}{% endblock %}
        </section>
    </main>

    <footer class="footer">
        © {% now "Y" %} Job AI · Найди работу, которая подходит тебе
    </footer>
</body>
</html>
