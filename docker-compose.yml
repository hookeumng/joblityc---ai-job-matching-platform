services:
  web:
    build: .
    container_name: job_ai
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "

  db:
    image: postgres:17
    container_name: job_ai_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_ai
      POSTGRES_USER: job_ai
      POSTGRES_PASSWORD: job_ai_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_ai -d job_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: